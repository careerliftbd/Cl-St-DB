<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login | Careerlift</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F3F4F6;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #FFFFFF;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%; max-width: 400px;
      text-align: center;
    }
    .logo {
      width: 48px; height: 48px; background: #4F46E5;
      border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px;
    }
    h2 { font-size: 22px; color: #111827; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B7280; margin-bottom: 24px; }
    
    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .input-group input {
      width: 100%; padding: 12px 16px;
      border: 1px solid #D1D5DB; border-radius: 8px;
      font-family: inherit; font-size: 14px;
      transition: all 0.2s;
    }
    .input-group input:focus { border-color: #4F46E5; outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    .btn-login {
      width: 100%; padding: 14px; margin-top: 10px;
      background: #4F46E5; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-login:hover { background: #4338CA; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">CL</div>
    <h2>Teacher Portal</h2>
    <p>Sign in to manage your classes & attendance</p>
    
    <form id="teacherLoginForm">
      <div class="input-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="e.g. 017XXXXXXXX" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Login to Portal</button>
    </form>
  </div>

  <script>
    // ── GUARD: আগে থেকেই লগইন করা থাকলে সরাসরি ড্যাশবোর্ডে পাঠিয়ে দেবে ──
    if (localStorage.getItem('teacherToken')) {
      window.location.href = '/teacher/dashboard.html';
    }

    document.getElementById('teacherLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/teachers/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.success) {
          // টোকেন এবং টিচার ডেটা লোকাল স্টোরেজে সেভ করা
          localStorage.setItem('teacherToken', data.token);
          localStorage.setItem('teacherData', JSON.stringify(data.teacher));
          
          Swal.fire({ icon: 'success', title: 'Login Successful', showConfirmButton: false, timer: 1000 }).then(() => {
            window.location.href = '/teacher/dashboard.html';
          });
        } else {
          Swal.fire('Error', data.message, 'error');
          btn.textContent = 'Login to Portal';
          btn.disabled = false;
        }
      } catch (err) {
        Swal.fire('Error', 'Server connection failed!', 'error');
        btn.textContent = 'Login to Portal';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
