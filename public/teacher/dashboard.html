<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Teacher Portal — Careerlift</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --primary-light: #EEF2FF;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --dark: #111827;
      --gray: #6B7280;
      --gray-light: #F3F4F6;
      --border: #E5E7EB;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: #F9FAFB; 
      color: var(--dark); 
      line-height: 1.6;
    }

    /* ── NAVBAR ── */
    .navbar {
      background: #FFFFFF; 
      border-bottom: 1px solid var(--border);
      padding: 16px 24px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      position: sticky; 
      top: 0; 
      z-index: 50;
      box-shadow: var(--shadow);
    }
    .nav-brand { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }
    .nav-brand .logo {
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); 
      color: #fff;
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-weight: 800; 
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .nav-brand .brand-text div { 
      font-size: 16px; 
      font-weight: 700; 
      line-height: 1.3; 
      color: var(--dark);
    }
    .nav-brand .brand-text span { 
      font-size: 12px; 
      color: var(--gray); 
      font-weight: 500;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .notification-btn {
      position: relative;
      background: var(--primary-light);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .notification-btn:hover {
      background: var(--primary);
      color: white;
    }
    .notification-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .notification-badge.show {
      display: flex;
    }
    .btn-logout {
      background: #FEE2E2; 
      color: #B91C1C; 
      border: none; 
      padding: 10px 20px;
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 13px; 
      cursor: pointer; 
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-logout:hover { 
      background: #FCA5A5; 
      transform: translateY(-1px);
    }

    /* ── CONTAINER ── */
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 32px 24px; 
    }

    /* ── GREETING ── */
    .greeting-section {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      margin-bottom: 32px;
    }
    .greeting h1 { 
      font-size: 28px; 
      font-weight: 800; 
      color: var(--dark);
      line-height: 1.3;
    }
    .greeting h1 span {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .greeting p { 
      font-size: 15px; 
      color: var(--gray); 
      margin-top: 6px; 
      font-weight: 500;
    }
    .date-card {
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .date-card .day {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .date-card .month-year {
      font-size: 13px;
      color: var(--gray);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .date-card .weekday {
      font-size: 14px;
      color: var(--dark);
      font-weight: 700;
      margin-top: 2px;
    }

    /* ── STATS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: 0.3s;
      box-shadow: var(--shadow);
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
    .stat-icon.green { background: #D1FAE5; color: var(--success); }
    .stat-icon.orange { background: #FEF3C7; color: var(--warning); }
    .stat-icon.red { background: #FEE2E2; color: var(--danger); }
    
    .stat-info h3 {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1;
    }
    .stat-info p {
      font-size: 13px;
      color: var(--gray);
      font-weight: 600;
      margin-top: 4px;
    }

    /* ── SECTIONS ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i {
      color: var(--primary);
      font-size: 18px;
    }

    /* ── CLASS GRID ── */
    .class-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 24px; 
      margin-bottom: 40px;
    }
    
    .class-card {
      background: #fff; 
      border: 1px solid var(--border); 
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .class-card:hover { 
      transform: translateY(-6px); 
      box-shadow: var(--shadow-lg);
    }
    .class-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
    }
    
    .class-header {
      padding: 24px 24px 16px;
    }
    .class-icon {
      width: 48px; 
      height: 48px; 
      background: var(--primary-light); 
      color: var(--primary);
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-bottom: 16px;
      font-size: 22px;
    }
    .class-title { 
      font-size: 17px; 
      font-weight: 700; 
      margin-bottom: 6px;
      color: var(--dark);
      line-height: 1.4;
    }
    .class-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .class-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .class-badge.batch {
      background: var(--primary-light);
      color: var(--primary);
    }
    .class-badge.students {
      background: #D1FAE5;
      color: var(--success);
    }
    .class-badge.time {
      background: #FEF3C7;
      color: var(--warning);
    }
    
    .class-footer {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }
    .btn-attend {
      flex: 1;
      display: inline-flex; 
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--primary); 
      color: #fff; 
      text-decoration: none;
      padding: 12px; 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 700; 
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-attend:hover { 
      background: var(--primary-dark); 
      transform: translateY(-1px);
    }
    .btn-attend.taken {
      background: var(--success);
      cursor: default;
    }
    .btn-attend.taken:hover {
      transform: none;
    }
    .btn-history {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--gray-light);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--gray);
      text-decoration: none;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn-history:hover {
      background: var(--border);
      color: var(--dark);
    }

    /* ── ACTIVITY ── */
    .activity-section {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      border-radius: 12px;
      transition: 0.2s;
    }
    .activity-item:hover {
      background: var(--gray-light);
    }
    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .activity-icon.present { background: #D1FAE5; color: var(--success); }
    .activity-icon.absent { background: #FEE2E2; color: var(--danger); }
    .activity-icon.late { background: #FEF3C7; color: var(--warning); }
    
    .activity-content h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
    }
    .activity-content p {
      font-size: 13px;
      color: var(--gray);
      margin-top: 2px;
    }
    .activity-time {
      font-size: 12px;
      color: var(--gray);
      font-weight: 500;
      margin-left: auto;
      white-space: nowrap;
    }

    /* ── LOADING & EMPTY ── */
    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: var(--gray);
    }
    .loading-state i {
      font-size: 40px;
      animation: spin 1s linear infinite;
      color: var(--primary);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .empty-state { 
      grid-column: 1 / -1; 
      text-align: center; 
      padding: 60px 40px; 
      color: var(--gray); 
      background: #fff; 
      border-radius: 16px; 
      border: 2px dashed var(--border);
    }
    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      color: #D1D5DB;
    }
    .empty-state h3 { 
      font-size: 18px; 
      font-weight: 700; 
      color: var(--dark);
      margin-bottom: 8px;
    }
    .empty-state p { 
      font-size: 14px; 
      max-width: 400px;
      margin: 0 auto;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .greeting-section {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .date-card { display: none; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .class-grid { grid-template-columns: 1fr; }
      .navbar { padding: 12px 16px; }
      .container { padding: 20px 16px; }
      .greeting h1 { font-size: 22px; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr; }
      .class-footer { flex-direction: column; }
      .btn-history { width: 100%; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="logo">CL</div>
      <div class="brand-text">
        <div>Teacher Portal</div>
        <span>Careerlift Institute</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="notification-btn" id="notifBtn" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notifCount">0</span>
      </button>
      <button class="btn-logout" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i>
        Log Out
      </button>
    </div>
  </nav>

  <div class="container">
    <!-- Greeting -->
    <div class="greeting-section">
      <div class="greeting">
        <h1 id="greetingTitle">Welcome back, <span id="teacherName">Teacher</span>! 👋</h1>
        <p id="greetingSub">Loading your dashboard...</p>
      </div>
      <div class="date-card" id="dateCard">
        <div class="day" id="currentDay">--</div>
        <div class="month-year" id="currentMonth">--- ----</div>
        <div class="weekday" id="currentWeekday">--------</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-chalkboard"></i></div>
        <div class="stat-info">
          <h3 id="totalClasses">--</h3>
          <p>Total Classes</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <h3 id="attendanceTaken">--</h3>
          <p>Attendance Taken Today</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <h3 id="totalStudents">--</h3>
          <p>Total Students</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-hourglass-half"></i></div>
        <div class="stat-info">
          <h3 id="pendingClasses">--</h3>
          <p>Pending Today</p>
        </div>
      </div>
    </div>

    <!-- Classes -->
    <div class="section-header">
      <div class="section-title">
        <i class="fas fa-book-open"></i>
        Your Classes
      </div>
    </div>

    <div class="class-grid" id="classContainer">
      <div class="loading-state">
        <i class="fas fa-circle-notch"></i>
        <p style="margin-top: 16px; font-weight: 600;">Loading your classes...</p>
      </div>
    </div>

    <!-- Activity -->
    <div class="section-header" style="margin-top: 40px;">
      <div class="section-title">
        <i class="fas fa-clock-rotate-left"></i>
        Recent Activity
      </div>
    </div>
    
    <div class="activity-section">
      <div class="activity-list" id="activityList">
        <div class="loading-state" style="padding: 40px;">
          <i class="fas fa-circle-notch"></i>
          <p style="margin-top: 12px; font-weight: 600;">Loading activity...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── CONFIG ──
    const API_BASE = '/api';
    const token = localStorage.getItem('teacherToken');
    const teacherDataStr = localStorage.getItem('teacherData');

    // ── GUARD ──
    if (!token || !teacherDataStr) {
      window.location.href = '/teacher/login.html';
    }

    const teacherData = JSON.parse(teacherDataStr);
    const todayStr = new Date().toLocaleDateString('en-CA');

    // ── DATE ──
    function updateDate() {
      const now = new Date();
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      
      document.getElementById('currentDay').textContent = now.getDate();
      document.getElementById('currentMonth').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
      document.getElementById('currentWeekday').textContent = days[now.getDay()];
    }
    updateDate();

    // ── SMART GREETING ──
    function setGreeting(name) {
      const hour = new Date().getHours();
      let greeting = 'Good Morning';
      let sub = 'Start your day with fresh energy! ☀️';
      
      if (hour >= 12 && hour < 17) {
        greeting = 'Good Afternoon';
        sub = 'Hope you are having a productive day! 🌤️';
      } else if (hour >= 17) {
        greeting = 'Good Evening';
        sub = 'Wrap up your day smoothly! 🌙';
      }
      
      document.getElementById('greetingTitle').innerHTML = `${greeting}, <span>${name}</span>! 👋`;
      document.getElementById('greetingSub').textContent = sub;
    }

    // ✅ FULL NAME (respectfully)
    const fullName = teacherData.name || 'Teacher';
    setGreeting(fullName);

    // ── LOGOUT ──
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('teacherToken');
      localStorage.removeItem('teacherData');
      window.location.href = '/teacher/login.html';
    });

    // ── FETCH REAL DATA ──
    async function loadDashboard() {
      try {
        // 1. Get teacher profile (fresh data)
        const profileRes = await fetch(`${API_BASE}/teachers/profile`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        let classes = [];
        if (profileRes.ok) {
          const profileData = await profileRes.json();
          classes = profileData.data?.assignedClasses || teacherData.assignedClasses || [];
        } else {
          classes = teacherData.assignedClasses || [];
        }

        // Update total classes stat
        document.getElementById('totalClasses').textContent = classes.length;

        if (classes.length === 0) {
          document.getElementById('classContainer').innerHTML = `
            <div class="empty-state">
              <i class="fas fa-book-open"></i>
              <h3>No Classes Assigned</h3>
              <p>Please contact the admin to assign classes to your profile.</p>
            </div>`;
          updateStats(0, 0, 0);
          loadActivity([]);
          return;
        }

        // 2. Fetch student count & attendance status for each class
        let totalStudents = 0;
        let attendanceTaken = 0;
        let classHtml = '';

        for (const cls of classes) {
          try {
            // Get student count
            const studentsRes = await fetch(
              `${API_BASE}/attendance/students?course=${encodeURIComponent(cls.courseName)}&batch=${encodeURIComponent(cls.batchNo)}`,
              { headers: { 'Authorization': `Bearer ${token}` } }
            );
            const studentsData = await studentsRes.json();
            const studentCount = studentsData.count || 0;
            totalStudents += studentCount;

            // Check if attendance already taken today
            const recordRes = await fetch(
              `${API_BASE}/attendance/record?course=${encodeURIComponent(cls.courseName)}&batch=${encodeURIComponent(cls.batchNo)}&date=${todayStr}`,
              { headers: { 'Authorization': `Bearer ${token}` } }
            );
            const isTaken = recordRes.ok;
            if (isTaken) attendanceTaken++;

            // ✅ CORRECT: Clean URL without .html
            const courseParam = encodeURIComponent(cls.courseName);
            const batchParam = encodeURIComponent(cls.batchNo);
            const attendanceUrl = `/teacher/take-attendance?course=${courseParam}&batch=${batchParam}`;

            classHtml += `
              <div class="class-card">
                <div class="class-header">
                  <div class="class-icon"><i class="fas fa-graduation-cap"></i></div>
                  <div class="class-title">${cls.courseName}</div>
                  <div class="class-meta">
                    <span class="class-badge batch"><i class="fas fa-layer-group"></i> ${cls.batchNo}</span>
                    <span class="class-badge students"><i class="fas fa-user-group"></i> ${studentCount} Students</span>
                  </div>
                </div>
                <div class="class-footer">
                  ${isTaken 
                    ? `<button class="btn-attend taken" disabled><i class="fas fa-check"></i> Attendance Taken</button>`
                    : `<a href="${attendanceUrl}" class="btn-attend"><i class="fas fa-clipboard-check"></i> Take Attendance</a>`
                  }
                  <button class="btn-history" onclick="alert('Coming soon!')" title="View History">
                    <i class="fas fa-history"></i>
                  </button>
                </div>
              </div>
            `;
          } catch (err) {
            console.error(`Error loading class ${cls.courseName}:`, err);
          }
        }

        document.getElementById('classContainer').innerHTML = classHtml;

        // 3. Update stats
        updateStats(attendanceTaken, totalStudents, classes.length - attendanceTaken);

        // 4. Load recent activity
        await loadActivity(classes);

      } catch (err) {
        console.error('Dashboard load error:', err);
        document.getElementById('classContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation" style="color: var(--danger);"></i>
            <h3>Failed to Load Data</h3>
            <p>Please check your internet connection and try again. Error: ${err.message}</p>
          </div>`;
      }
    }

    function updateStats(taken, students, pending) {
      document.getElementById('attendanceTaken').textContent = taken;
      document.getElementById('totalStudents').textContent = students;
      document.getElementById('pendingClasses').textContent = pending;
    }

    // ── LOAD RECENT ACTIVITY (REAL DATA) ──
    async function loadActivity(classes) {
      const activityList = document.getElementById('activityList');
      
      try {
        const res = await fetch(`${API_BASE}/teachers/attendance-history?limit=5`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('Failed to fetch activity');

        const data = await res.json();
        const records = data.data || [];

        if (records.length === 0) {
          activityList.innerHTML = `
            <div class="empty-state" style="padding: 40px; border: none;">
              <i class="fas fa-inbox"></i>
              <h3>No Recent Activity</h3>
              <p>Your attendance records will appear here once you start taking attendance.</p>
            </div>`;
          return;
        }

        activityList.innerHTML = records.map(r => {
          const total = r.records?.length || 0;
          const present = r.records?.filter(x => x.status === 'Present').length || 0;
          const absent = total - present;
          
          let icon = 'fa-check';
          let type = 'present';
          let desc = `${present} Present, ${absent} Absent`;
          
          if (absent > present) {
            icon = 'fa-triangle-exclamation';
            type = 'absent';
          } else if (r.records?.some(x => x.status === 'Late')) {
            icon = 'fa-clock';
            type = 'late';
          }

          const timeAgo = getTimeAgo(r.createdAt || r.date);

          return `
            <div class="activity-item">
              <div class="activity-icon ${type}"><i class="fas ${icon}"></i></div>
              <div class="activity-content">
                <h4>${r.courseName} — ${r.batchNo}</h4>
                <p>${desc} • ${total} Total Students</p>
              </div>
              <div class="activity-time">${timeAgo}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Activity load error:', err);
        activityList.innerHTML = classes.slice(0, 3).map(cls => `
          <div class="activity-item">
            <div class="activity-icon present"><i class="fas fa-hourglass-half"></i></div>
            <div class="activity-content">
              <h4>${cls.courseName} — ${cls.batchNo}</h4>
              <p>Attendance pending for today</p>
            </div>
            <div class="activity-time">Today</div>
          </div>
        `).join('');
      }
    }

    // ── HELPER: Time Ago ──
    function getTimeAgo(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return `${diffDays} days ago`;
      return date.toLocaleDateString('en-GB');
    }

    // ── NOTIFICATIONS ──
    document.getElementById('notifBtn').addEventListener('click', async () => {
      try {
        const res = await fetch(`${API_BASE}/teachers/notifications`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const count = data.count || 0;
        const badge = document.getElementById('notifCount');
        badge.textContent = count;
        badge.classList.toggle('show', count > 0);
        alert(`🔔 Notifications (${count}):\n\n${data.notifications?.map(n => `• ${n.message}`).join('\n') || 'No new notifications'}`);
      } catch {
        alert('🔔 Notifications:\n\n• Take attendance for today\'s classes\n• Review yesterday\'s attendance report');
      }
    });

    // ── INIT ──
    loadDashboard();
  </script>
</body>
</html>
