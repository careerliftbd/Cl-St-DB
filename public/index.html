<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Careerlift Student Management</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 30px;
            color: #fff;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card glass">
            <h2>Careerlift Admin</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="admin@careerlift.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
            </form>
            <p id="message" style="margin-top: 15px; color: #f87171; font-size: 14px;"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // টোকেন লোকাল স্টোরেজে সেভ করা
                    localStorage.setItem('adminToken', data.token);
                    // ড্যাশবোর্ডে রিডাইরেক্ট করা (আমরা পরে ড্যাশবোর্ড পেজ বানাবো)
                    window.location.href = '/dashboard.html';
                } else {
                    message.innerText = data.message;
                }
            } catch (err) {
                message.innerText = "সার্ভার এরর!";
            }
        });
    </script>
</body>
</html>
